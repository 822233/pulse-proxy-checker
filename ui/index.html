<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse 中文版 — 代理检测工具</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="update-banner" id="update-banner" hidden>
        <span id="update-text">Pulse 有新版本可用。</span>
        <a class="update-download" id="update-download" href="#">下载 ↗</a>
        <button class="update-dismiss" id="update-dismiss" title="关闭">✕</button>
      </div>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
              <defs>
                <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#8dff9e"/>
                  <stop offset="1" stop-color="#36e2ff"/>
                </linearGradient>
                <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="2.2" result="b"/>
                  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>
              <circle cx="24" cy="24" r="21" fill="none" stroke="url(#pulseGrad)" stroke-width="2.5" opacity="0.28"/>
              <path d="M4 24 H15 L19 13 L25 35 L29 20 L32 24 H44"
                    fill="none" stroke="url(#pulseGrad)" stroke-width="3.2"
                    stroke-linecap="round" stroke-linejoin="round" filter="url(#pulseGlow)"/>
            </svg>
          </span>
          <span class="brand-name">Pulse</span>
          <span class="brand-tag">代理检测工具</span>
        </div>
        <!-- DB-IP Lite (CC BY 4.0) requires this attribution on screens using the data. -->
        <a class="attribution" href="https://db-ip.com" target="_blank" rel="noopener">IP Geolocation by DB-IP</a>
      </header>

      <!-- ======================= INPUT VIEW ======================= -->
      <main class="content" id="view-input">
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="paste">粘贴检测</button>
          <button class="mode-tab" data-mode="free">免费代理</button>
          <button class="mode-tab" data-mode="saved">已保存代理</button>
        </div>

        <div class="content-head">
          <h1 id="page-title">粘贴代理列表</h1>
          <div class="controls">
            <label class="field-inline">
              并发数
              <input id="concurrency" type="number" min="1" max="500" value="100" />
            </label>
            <label class="field-inline">
              超时时间（毫秒）
              <input id="timeout" type="number" min="1000" step="500" value="6000" />
            </label>
          </div>
        </div>

        <div class="protocol-row">
          <span class="protocol-label">代理协议：</span>
          <div class="pill-group" id="protocol-group">
            <button class="pill active" data-scheme="http">HTTP</button>
            <button class="pill" data-scheme="https">HTTPS</button>
            <button class="pill" data-scheme="socks4">SOCKS4</button>
            <button class="pill" data-scheme="socks5">SOCKS5</button>
          </div>
        </div>

        <div class="free-bar" id="free-bar" hidden>
          <button class="btn-primary" id="btn-find-alive">⚡ 自动获取并检测</button>
          <span class="free-status" id="free-status">从公开代理列表获取节点，并自动检测可用性。</span>
        </div>

        <textarea
          id="proxy-input"
          class="proxy-input"
          spellcheck="false"
          placeholder="请粘贴代理列表，支持以下格式：
  • {host}:{port}
  • {host}:{port}:{username}:{password}
  • {host}:{port}@{username}:{password}
  • {scheme}://{host}:{port}
  • {scheme}://{username}:{password}@{host}:{port}
  ({scheme} = http, https, socks4, socks5 — 未指定协议时，使用上方选择的协议)"
        ></textarea>

        <div class="footer-row">
          <span class="counter"><span class="info-dot">ⓘ</span> <b id="proxy-count">0</b> 个代理</span>
          <div class="footer-actions">
            <button class="btn-ghost" id="btn-clear">清空</button>
            <button class="btn-primary" id="btn-check" disabled>开始检测</button>
          </div>
        </div>
      </main>

      <!-- ======================= CHECKER VIEW ======================= -->
      <main class="content" id="view-checker" hidden>
        <div class="content-head">
          <div class="check-title">
            <button class="btn-back" id="btn-back">←</button>
            <h1 id="check-title">正在检测代理…</h1>
          </div>
          <div class="footer-actions">
            <button class="btn-ghost" id="btn-save-all" disabled>💾 保存全部可用</button>
            <button class="btn-ghost" id="btn-save-working" disabled>💾 保存筛选结果</button>
            <button class="btn-ghost" id="btn-copy" disabled>复制</button>
            <button class="btn-ghost" id="btn-export" disabled>导出</button>
          </div>
        </div>

        <div class="results-head">
          <div class="stat"><b id="stat-total">0</b><span>总数</span></div>
          <div class="stat ok"><b id="stat-working">0</b><span>可用</span></div>
          <div class="stat dead"><b id="stat-dead">0</b><span>失效</span></div>
          <div class="progress"><div class="bar" id="progress-bar"></div></div>
        </div>
        <div class="check-status" id="check-status"></div>

        <!-- filter bar (shared markup pattern, this instance drives the checker list) -->
        <div class="filter-bar" id="filter-bar">
          <label class="toggle"><input type="checkbox" id="hide-dead" checked /> 隐藏不可用代理</label>
          <label class="field-inline">风险等级
            <select id="f-risk"><option value="">全部</option><option value="Low">低</option><option value="Medium">中</option><option value="High">高</option></select>
          </label>
          <label class="field-inline">国家/地区
            <select id="f-country"><option value="">全部</option></select>
          </label>
          <label class="field-inline">最大延迟（毫秒）
            <input id="f-latency" type="number" min="0" step="500" placeholder="不限" />
          </label>
          <label class="field-inline">最低质量（%）
            <input id="f-quality" type="number" min="0" max="100" step="5" placeholder="不限" />
          </label>
          <span class="filter-count" id="filter-count"></span>
        </div>

        <div class="results-cols">
          <span></span><span>代理地址</span><span>状态</span><span>国家/地区</span>
          <span>出口 IP</span><span>质量</span><span>风险</span><span>延迟</span>
        </div>
        <div class="results-list big" id="results-list"></div>
      </main>

      <!-- ======================= SAVED PROXIES VIEW ======================= -->
      <main class="content" id="view-saved" hidden>
        <div class="mode-tabs">
          <button class="mode-tab" data-mode="paste">粘贴检测</button>
          <button class="mode-tab" data-mode="free">免费代理</button>
          <button class="mode-tab active" data-mode="saved">已保存代理</button>
        </div>
        <div class="content-head">
          <h1>已保存代理</h1>
          <div class="footer-actions">
            <div class="pill-group" id="saved-proto-group">
              <button class="pill active" data-scheme="http">HTTP</button>
              <button class="pill" data-scheme="https">HTTPS</button>
              <button class="pill" data-scheme="socks4">SOCKS4</button>
              <button class="pill" data-scheme="socks5">SOCKS5</button>
            </div>
          </div>
        </div>
        <div class="footer-actions" style="justify-content:flex-start; gap:10px;">
          <button class="btn-primary" id="btn-recheck-saved">♻ 重新检测全部</button>
          <button class="btn-ghost" id="btn-remove-dead" disabled>🗑 删除失效代理</button>
          <button class="btn-ghost" id="btn-saved-copy" disabled>复制</button>
          <button class="btn-ghost" id="btn-saved-export" disabled>导出</button>
          <button class="btn-ghost" id="btn-saved-clear" disabled>清空代理池</button>
          <span class="check-status" id="saved-status"></span>
        </div>

        <div class="filter-bar" id="saved-filter-bar">
          <label class="toggle"><input type="checkbox" id="sf-hide-dead" /> 隐藏不可用代理</label>
          <label class="field-inline">风险等级
            <select id="sf-risk"><option value="">全部</option><option value="Low">低</option><option value="Medium">中</option><option value="High">高</option></select>
          </label>
          <label class="field-inline">国家/地区
            <select id="sf-country"><option value="">全部</option></select>
          </label>
          <label class="field-inline">最大延迟（毫秒）
            <input id="sf-latency" type="number" min="0" step="500" placeholder="不限" />
          </label>
          <label class="field-inline">最低质量（%）
            <input id="sf-quality" type="number" min="0" max="100" step="5" placeholder="不限" />
          </label>
          <span class="filter-count" id="saved-filter-count"></span>
        </div>

        <div class="results-cols">
          <span></span><span>代理地址</span><span>状态</span><span>国家/地区</span>
          <span>出口 IP</span><span>质量</span><span>风险</span><span>延迟</span>
        </div>
        <div class="results-list big" id="saved-list"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
