name: 中文版构建验证

on:
  push:
    branches: [chinese-localization]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装并检查代理检测引擎
        working-directory: host
        shell: bash
        run: |
          npm ci || npm install
          node --check src/host.js
          node --check src/cli.js
          npx -y pkg@5.8.1 . --targets node18-win-x64 --output dist/PulseEngine.exe

      - name: 暂存 Tauri 引擎资源
        shell: bash
        run: |
          mkdir -p src-tauri/assets
          cp host/dist/PulseEngine.exe src-tauri/assets/PulseEngine.exe

      - name: 安装并构建中文界面
        working-directory: ui
        shell: bash
        run: |
          npm ci || npm install
          npm run build

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --locked

      - name: 构建 Windows NSIS 安装程序
        run: cargo tauri build --bundles nsis

      - name: 上传 Windows 安装程序
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-中文版-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 提取免安装便携版
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 NSIS 安装程序" }
          $portable = Join-Path $PWD "Pulse-中文版-Windows-Portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          7z x $installer.FullName "-o$portable" -y
          if ($LASTEXITCODE -ne 0) { throw "提取 NSIS 安装包失败" }
          $app = Get-ChildItem $portable -Recurse -Filter "Pulse.exe" | Select-Object -First 1
          if (-not $app) { throw "便携版缺少 Pulse.exe" }
          if (-not (Get-ChildItem $portable -Recurse -Filter "PulseEngine.exe")) { throw "便携版缺少 PulseEngine.exe" }
          "便携版目录：$portable"
          Get-ChildItem $portable -Recurse | Select-Object FullName,Length

      - name: 上传 Windows 免安装便携版
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-中文版-Windows-Portable
          path: Pulse-中文版-Windows-Portable/
          if-no-files-found: error
          retention-days: 14
